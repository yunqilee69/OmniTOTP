name: Release

# 推送 v* tag 时在 Windows / macOS / Linux 三端构建并发布 GitHub Release；
# 也可在 Actions 页面手动指定已有 tag 重新发布（例如某个平台构建失败后补发）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag，例如 v1.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Release (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --target x86_64-pc-windows-msvc
          - name: macOS Universal
            platform: macos-latest
            args: --target universal-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # 三处版本号必须与 tag 一致，避免发出去的安装包版本和 Release 对不上
      - name: Verify version matches tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"

          echo "tag=${tag} package.json=${pkg} tauri.conf.json=${conf} Cargo.toml=${cargo}"
          [ "$pkg" = "$tag" ] || { echo "::error::package.json 版本 $pkg 与 tag $tag 不一致"; exit 1; }
          [ "$conf" = "$tag" ] || { echo "::error::tauri.conf.json 版本 $conf 与 tag $tag 不一致"; exit 1; }
          [ "$cargo" = "$tag" ] || { echo "::error::Cargo.toml 版本 $cargo 与 tag $tag 不一致"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev \
            patchelf \
            rpm \
            libfuse2 \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: OmniTOTP ${{ env.TAG }}
          releaseBody: |
            OmniTOTP ${{ env.TAG }} 桌面安装包。

            - Windows：`.msi` / `.exe`（NSIS）
            - macOS：`.dmg`（Universal，Intel + Apple Silicon）
            - Linux：`.AppImage` / `.deb` / `.rpm`
          generateReleaseNotes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          releaseDraft: false
          args: ${{ matrix.args }}
